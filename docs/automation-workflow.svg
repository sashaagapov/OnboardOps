<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">n8n daily operations workflow</title><desc id="svgdesc">Manual Trigger and Schedule Trigger converge on an HTTP GET to the FastAPI summary. The HTTP response independently feeds the overdue IF to Telegram and Google Sheets append-or-update by date.</desc>
<defs><style>
 text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 .eyebrow{font-size:16px;font-weight:750;letter-spacing:2.4px;fill:#1e3a5f}
 .title{font-size:52px;font-weight:760;letter-spacing:-2px;fill:#111827}
 .subtitle{font-size:22px;font-weight:440;fill:#586579}
 .section{font-size:17px;font-weight:760;letter-spacing:2px;fill:#1e3a5f}
 .card-title{font-size:27px;font-weight:740;letter-spacing:-.5px;fill:#111827}
 .body{font-size:20px;font-weight:450;fill:#374151}
 .small{font-size:17px;font-weight:480;fill:#586579}
 .tiny{font-size:15px;font-weight:600;fill:#586579}
 .foot{font-size:16px;font-weight:650;fill:#586579;letter-spacing:1px}
 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:650;fill:#1e3a5f}
 .big{font-size:36px;font-weight:770;letter-spacing:-1px;fill:#111827}
 .line{stroke:#7289a5;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
 .blue-line{stroke:#1d6fa8;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
 .green-line{stroke:#16854b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
 </style>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#7289a5"/></marker>
 <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#1d6fa8"/></marker>
 <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#16854b"/></marker>
 </defs>
<rect width="1200" height="1200" fill="#f5f7fa"/>
<text class="eyebrow" x="64" y="76">AUTOMATION MAP</text>
<text class="title" x="64" y="139">One request, two branches</text>
<text class="subtitle" x="64" y="181">The exported n8n workflow reads the FastAPI operations summary.</text>
<path d="M64 209 H1136" stroke="#dbe2ea" stroke-width="2"/>
<rect x="64" y="242" width="1072" height="862" rx="22" fill="#ffffff" stroke="#dbe2ea" stroke-width="2"/>
<text class="section" x="96" y="286">TRIGGERS</text>
<rect x="96" y="318" width="466" height="144" rx="22" fill="#f8fbff" stroke="#c7d8e7" stroke-width="2"/>
<rect x="638" y="318" width="466" height="144" rx="22" fill="#f8fbff" stroke="#c7d8e7" stroke-width="2"/>
<text class="eyebrow" x="124" y="365">MANUAL TRIGGER</text>
<text class="card-title" x="124" y="413">Execute workflow</text>
<text class="eyebrow" x="666" y="365">SCHEDULE TRIGGER</text>
<text class="card-title" x="666" y="413">Daily · 09:00 Europe/Kyiv</text>
<path class="line" d="M329 462 V510 H600"/>
<path class="line" d="M871 462 V510 H600"/>
<path class="line" d="M600 510 V551" marker-end="url(#arrow)"/>
<rect x="347" y="556" width="506" height="158" rx="22" fill="#ffffff" stroke="#dbe2ea" stroke-width="2"/>
<text class="eyebrow" x="380" y="603">HTTP REQUEST</text>
<text class="card-title" x="380" y="651">GET /operations/summary</text>
<text class="small" x="380" y="684">FastAPI returns the seven current metrics.</text>
<path class="line" d="M600 714 V760 H316 V796" marker-end="url(#arrow)"/>
<path class="line" d="M600 760 H888 V796" marker-end="url(#arrow)"/>
<text class="tiny" x="318" y="739" text-anchor="middle">ALERT BRANCH</text>
<text class="tiny" x="887" y="739" text-anchor="middle">REPORT BRANCH</text>
<rect x="96" y="804" width="440" height="128" rx="22" fill="#fffaf0" stroke="#efd8a4" stroke-width="2"/>
<rect x="666" y="804" width="438" height="209" rx="22" fill="#f5fbf7" stroke="#bddfc9" stroke-width="2"/>
<text class="eyebrow" x="124" y="849">IF</text>
<text class="card-title" x="124" y="890">overdue_tasks &gt; 0</text>
<text class="small" x="124" y="916">False: no Telegram message</text>
<text class="eyebrow" x="694" y="849">GOOGLE SHEETS</text>
<text class="card-title" x="694" y="892">Append or Update Row</text>
<text class="body" x="694" y="929">Match on date · Europe/Kyiv</text>
<text class="small" x="694" y="966">Runs for every successful HTTP response.</text>
<path class="green-line" d="M316 932 V976" marker-end="url(#green-arrow)"/>
<text class="tiny" x="338" y="961">TRUE</text>
<rect x="96" y="986" width="440" height="100" rx="22" fill="#f5fbf7" stroke="#bddfc9" stroke-width="2"/>
<text class="eyebrow" x="124" y="1027">TELEGRAM</text>
<text class="card-title" x="124" y="1062">Overdue notification</text>
<path d="M64 1130 H1136" stroke="#dbe2ea" stroke-width="2"/>
<text class="foot" x="64" y="1165">ONBOARDOPS  /  PERSONAL ENGINEERING PROJECT</text>
<text class="foot" x="1136" y="1165" text-anchor="end">N8N WORKFLOW</text>
</svg>
