<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">OnboardOps n8n daily workflow</title>
  <desc id="description">Manual and daily schedule triggers call the operations summary endpoint. The result is checked for overdue tasks, sends Telegram notification when overdue tasks exist, and writes a date-based upsert into Google Sheets.</desc>
  <defs><style>
    .bg { fill:#f7f8fa } .node { fill:#fff; stroke:#d7dde5; stroke-width:2 } .trigger { fill:#eff6ff; stroke:#93c5fd } .condition { fill:#fffbeb; stroke:#fcd34d } .output { fill:#f0fdf4; stroke:#86efac }
    .t { font:700 17px system-ui,sans-serif; fill:#1f2937 } .s { font:500 13px system-ui,sans-serif; fill:#596579 } .a { stroke:#5b7fa7; stroke-width:3; fill:none; marker-end:url(#m) }
  </style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b7fa7"/></marker></defs>
  <rect class="bg" width="1200" height="460" rx="18"/>
  <text class="t" x="52" y="58">n8n — Daily Operations workflow</text><text class="s" x="52" y="84">Sanitized configuration: credentials, chat ID, message and sheet target must be reconnected locally.</text>
  <rect class="node trigger" x="55" y="150" width="180" height="85" rx="12"/><text class="t" x="78" y="185">Manual Trigger</text><text class="s" x="78" y="210">Manual check</text>
  <rect class="node trigger" x="55" y="300" width="180" height="85" rx="12"/><text class="t" x="78" y="335">Schedule Trigger</text><text class="s" x="78" y="360">09:00 Europe/Kyiv</text>
  <rect class="node" x="340" y="220" width="195" height="90" rx="12"/><text class="t" x="365" y="255">HTTP Request</text><text class="s" x="365" y="280">GET /operations/summary</text>
  <rect class="node condition" x="640" y="150" width="190" height="85" rx="12"/><text class="t" x="665" y="185">IF overdue &gt; 0</text><text class="s" x="665" y="210">True branch alert</text>
  <rect class="node output" x="945" y="125" width="185" height="85" rx="12"/><text class="t" x="971" y="160">Telegram</text><text class="s" x="971" y="185">Overdue notification</text>
  <rect class="node output" x="915" y="295" width="240" height="90" rx="12"/><text class="t" x="940" y="330">Google Sheets</text><text class="s" x="940" y="355">Append or Update Row · date</text>
  <path class="a" d="M235 192 H290 Q310 192 310 240 V265 H340"/><path class="a" d="M235 342 H290 Q310 342 310 290 V265 H340"/><path class="a" d="M535 265 H590 Q610 265 610 192 H640"/><path class="a" d="M830 192 H945"/><path class="a" d="M535 265 H915"/>
  <text class="s" x="860" y="175">true</text><text class="s" x="760" y="280">daily snapshot</text>
</svg>
