<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">OnboardOps architecture</title>
  <desc id="description">React Operations Console communicates with a FastAPI REST API and SQLite. FastAPI summary data is used by n8n automation, which sends Telegram alerts and writes daily Google Sheets snapshots.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; } .card { fill: #ffffff; stroke: #d7dde5; stroke-width: 2; }
      .title { font: 700 25px system-ui, sans-serif; fill: #16263d; } .sub { font: 500 16px system-ui, sans-serif; fill: #596579; }
      .label { font: 700 14px system-ui, sans-serif; fill: #1d3f67; letter-spacing: 1px; } .body { font: 500 16px system-ui, sans-serif; fill: #2d3748; }
      .arrow { stroke: #5b7fa7; stroke-width: 3; fill: none; marker-end: url(#arrow); } .dashed { stroke-dasharray: 7 7; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b7fa7"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="18"/>
  <text class="title" x="60" y="64">OnboardOps — system architecture</text>
  <text class="sub" x="60" y="94">Local development flow for the simulated client-onboarding scenario</text>
  <rect class="card" x="60" y="175" width="220" height="145" rx="14"/>
  <text class="label" x="86" y="215">REACT + TYPESCRIPT</text>
  <text class="body" x="86" y="252">Operations Console</text>
  <text class="sub" x="86" y="280">Clients, tasks, KPIs</text>
  <rect class="card" x="390" y="175" width="220" height="145" rx="14"/>
  <text class="label" x="416" y="215">FASTAPI</text>
  <text class="body" x="416" y="252">REST API</text>
  <text class="sub" x="416" y="280">Validation &amp; operations summary</text>
  <rect class="card" x="720" y="175" width="220" height="145" rx="14"/>
  <text class="label" x="746" y="215">SQLITE</text>
  <text class="body" x="746" y="252">Task storage</text>
  <text class="sub" x="746" y="280">Local, auto-initialized</text>
  <path class="arrow" d="M280 230 H390"/><path class="arrow" d="M390 270 H280"/>
  <path class="arrow" d="M610 230 H720"/><path class="arrow" d="M720 270 H610"/>
  <rect class="card" x="390" y="395" width="220" height="105" rx="14"/>
  <text class="label" x="416" y="433">N8N</text><text class="body" x="416" y="465">Daily workflow automation</text>
  <rect class="card" x="745" y="380" width="180" height="80" rx="14"/>
  <text class="label" x="770" y="415">TELEGRAM</text><text class="sub" x="770" y="440">Overdue alert</text>
  <rect class="card" x="975" y="380" width="180" height="80" rx="14"/>
  <text class="label" x="1000" y="415">GOOGLE SHEETS</text><text class="sub" x="1000" y="440">Daily upsert</text>
  <path class="arrow dashed" d="M500 320 V395"/><path class="arrow" d="M610 447 H745"/><path class="arrow" d="M610 447 H975"/>
  <text class="sub" x="626" y="365">GET /operations/summary</text>
</svg>
