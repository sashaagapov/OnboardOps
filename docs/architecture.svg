<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">How OnboardOps works</title><desc id="svgdesc">Interactive React client and n8n independently consume the same FastAPI REST API. FastAPI persists tasks in SQLite and calculates the operations summary.</desc>
<defs><style>
