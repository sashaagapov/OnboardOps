<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Task lifecycle and KPI logic</title><desc id="desc">Typical progression from pending to in progress to completed, and the formulas for total tasks, completion rate, overdue tasks, and unique clients.</desc>
<rect width="1200" height="1200" fill="#f5f7fa"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#7890a9"/></marker></defs>
<text x="64" y="77" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="760" fill="#1e3a5f" letter-spacing="2.4">METRIC LOGIC</text>
<text x="64" y="139" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="50" font-weight="760" fill="#111827" letter-spacing="-2">Task lifecycle &amp; KPI logic</text>
<text x="64" y="180" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="450" fill="#586579">A typical progression; the API allows any valid status update.</text>
<path d="M64 209 H1136" fill="none" stroke="#dbe2ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="64" y="242" width="1072" height="355" rx="20" fill="#ffffff" stroke="#dbe2ea" stroke-width="2"/>
<text x="96" y="286" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="760" fill="#1e3a5f" letter-spacing="2">TASK STATUS</text>
<rect x="96" y="327" width="300" height="167" rx="18" fill="#f8fafc" stroke="#dbe2ea" stroke-width="2"/>
<text x="121" y="374" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="730" fill="#111827" letter-spacing="-0.6">Pending</text>
<text x="121" y="409" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="650" fill="#1e3a5f">pending</text>
<text x="121" y="457" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="470" fill="#586579">Awaiting work</text>
<rect x="450" y="327" width="300" height="167" rx="18" fill="#f3f8fc" stroke="#c7d8e7" stroke-width="2"/>
<text x="475" y="374" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="730" fill="#111827" letter-spacing="-0.6">In progress</text>
<text x="475" y="409" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="650" fill="#1e3a5f">in_progress</text>
<text x="475" y="457" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="470" fill="#586579">Work underway</text>
<rect x="804" y="327" width="300" height="167" rx="18" fill="#f5fbf7" stroke="#bddfc9" stroke-width="2"/>
<text x="829" y="374" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="730" fill="#111827" letter-spacing="-0.6">Completed</text>
<text x="829" y="409" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="650" fill="#1e3a5f">completed</text>
<text x="829" y="457" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="470" fill="#586579">Work finished</text>
<path d="M398 411 H444" fill="none" stroke="#7890a9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M752 411 H798" fill="none" stroke="#7890a9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="96" y="555" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="500" fill="#586579">Illustrative flow only · status changes are not restricted to these arrows.</text>
<rect x="64" y="627" width="348" height="251" rx="20" fill="#ffffff" stroke="#dbe2ea" stroke-width="2"/>
<rect x="64" y="627" width="348" height="9" rx="4" fill="#e6eef6" stroke="#e6eef6" stroke-width="0"/>
<text x="90" y="679" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="760" fill="#1e3a5f" letter-spacing="2">TOTAL TASKS</text>
<text x="90" y="737" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#111827" letter-spacing="-0.6">Pending + In progress</text>
<text x="90" y="776" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="530" fill="#374151">+ Completed</text>
<text x="90" y="837" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="480" fill="#586579">Status counts sum to Total.</text>
<rect x="426" y="627" width="348" height="251" rx="20" fill="#ffffff" stroke="#dbe2ea" stroke-width="2"/>
<rect x="426" y="627" width="348" height="9" rx="4" fill="#e7f3eb" stroke="#e7f3eb" stroke-width="0"/>
<text x="452" y="679" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="760" fill="#1e3a5f" letter-spacing="2">COMPLETION RATE</text>
<text x="452" y="737" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#111827" letter-spacing="-0.6">Completed ÷ Total × 100</text>
<text x="452" y="776" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="530" fill="#374151">0% when Total = 0</text>
<text x="452" y="837" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="480" fill="#586579">Rounded to 2 decimals.</text>
<rect x="788" y="627" width="348" height="251" rx="20" fill="#ffffff" stroke="#dbe2ea" stroke-width="2"/>
<rect x="788" y="627" width="348" height="9" rx="4" fill="#fff1d8" stroke="#fff1d8" stroke-width="0"/>
<text x="814" y="679" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="760" fill="#1e3a5f" letter-spacing="2">OVERDUE TASKS</text>
<text x="814" y="737" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#111827" letter-spacing="-0.6">Due date &lt; today</text>
<text x="814" y="776" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="530" fill="#374151">AND status is open</text>
<text x="814" y="837" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="480" fill="#586579">Pending or In progress.</text>
<rect x="64" y="910" width="1072" height="190" rx="20" fill="#f8fbff" stroke="#c7d8e7" stroke-width="2"/>
<text x="96" y="964" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="760" fill="#1e3a5f" letter-spacing="2">UNIQUE CLIENTS</text>
<text x="96" y="1012" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="29" font-weight="720" fill="#111827" letter-spacing="-0.5">Distinct client values among stored tasks</text>
<text x="96" y="1053" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="480" fill="#586579">A client is counted only when at least one task exists.</text>
<path d="M64 1130 H1136" fill="none" stroke="#dbe2ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1165" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="650" fill="#586579" letter-spacing="1">ONBOARDOPS  /  PERSONAL ENGINEERING PROJECT</text>
<text x="1136" y="1165" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="650" fill="#586579" letter-spacing="1" text-anchor="end">05 / 05</text>
</svg>
