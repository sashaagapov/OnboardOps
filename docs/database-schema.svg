<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">SQLite task schema</title><desc id="desc">The single SQLite tasks table, its five fields, unique index on client and title, and the derived client list.</desc>
