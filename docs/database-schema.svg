<text x="64" y="179" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="450" fill="#586579">Clients are represented by their stored tasks.</text>
