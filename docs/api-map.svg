<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
<title id="title">OnboardOps REST API map</title><desc id="desc">Seven FastAPI routes and their actual React or n8n consumers.</desc>
